<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Legend of Link</title>
    <link rel="stylesheet" href="../../CSS/Ejercicios 1/botton.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
        div {
            padding: 3em;
        }
    </style>
</head>

<body>
    <div>
        <a class="button" href="../../index.html">
            <p>Volver</p>
        </a>
    </div>

        </a>
    </div>

        <a class="button" href="https://www.youtube.com">
            <p>YouTube</p>
        </a>
    </div>
    <div>
        <a class="button"
            href="https://www.istockphoto.com/es/search/2/image-film?phrase=calvo&tracked_gsrp_landing=https%3A%2F%2Fwww.istockphoto.com%2Fes%2Ffotos%2Fcalvo">

        </a>
    </div>
    <div>
        <a class="button" href="https://gemini.google.com">

        </a>

</html>
