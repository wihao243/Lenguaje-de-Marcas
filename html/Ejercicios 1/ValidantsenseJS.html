<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Validación Nativa</title>
    <link rel="stylesheet" href="../../CSS/Ejercicios 1/botton.css">
</head>
<body>

    <a class="button" href="../../index.html">
        <p>Volver</p>
    </a>

    <h1>Registro Validado</h1>

    <form action="#" method="post">
        <div>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>

        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" minlength="8" placeholder="Mínimo 8 caracteres" required>
        </div>

        <div>
            <label for="telefono">Número de teléfono:</label>
            <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" maxlength="9" placeholder="612345678" title="Introduce exactamente 9 dígitos numéricos sin espacios ni guiones" required>
        </div>

        <button type="submit">Enviar datos</button>
    </form>

</body>
</html>
