<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="stylesheet" href="../../CSS/Ejercicios 1/botton.css">

<body>

    <a class="button" href="../../index.html">

    <form action="#" method="post">
        <div>
            <label for="nombre">Nombre:</label>
            <input class="texto" type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>
        <br>
        <div>
            <label for="email">Correo electrónico:</label>
            <input class="texto" type="email" id="email" name="email" placeholder="Escribe tu correo electrónico" required>
        </div>
        <br>
        <div>
            <label for="mensaje">Mensaje:</label>
            <br>
            <textarea class="texto" id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
        </div>
        <br>
        <input type="checkbox" id="checkbox" name="opcional1" value="valor1" required>
        <label for="checkbox">Acepta las condiciones.</label>
        <br>
        <br>
        <button class="button" type="submit">Enviar</button>
    </form>

</body>

</html>
