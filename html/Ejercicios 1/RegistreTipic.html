<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="../../CSS/Ejercicios 1/botton.css">
</head>
<body>

    <a class="button" href="../../index.html">
        <p>Volver</p>
    </a>

    <h1>Crear una cuenta</h1>

    <form action="#" method="post">
        <div>
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
        </div>

        <div>
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="Escribe tu correo electrónico" required>
        </div>

        <div>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Crea tu contraseña" required>
        </div>

        <div>
            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label>
        </div>

        <button type="submit">Registrarse</button>
    </form>

</body>
</html>
